<!DOCTYPE html>
<html lang="km">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cute </title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #ffd6e7, #d9e7ff);
            overflow: hidden;
        }

        /* Container */
        .container {
            width: 350px;
            min-height: 500px;
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            padding: 25px;
            text-align: center;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.15);
            position: relative;
            overflow: hidden;
        }

        /* Page */
        .page {
            display: none;
            animation: slideIn 0.6s ease;
        }

        .page.active {
            display: block;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(40px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Cute image */
        .cute-img {
            width: 210px;
            height: 210px;
            object-fit: cover;
            border-radius: 25px;
            margin: 15px auto;
            display: block;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-12px);
            }
        }

        /* Text */
        h1 {
            color: #ff5f9e;
            margin: 15px 0;
        }

        p {
            color: #555;
            font-size: 17px;
            line-height: 1.7;
        }

        /* Clickable text */
        .click-text {
            display: inline-block;
            margin-top: 15px;
            color: #ff4f91;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .click-text:hover {
            transform: scale(1.1);
            color: #ff176f;
        }

        /* Buttons */
        .buttons {
            position: absolute;
            bottom: 20px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-around;
        }

        button {
            border: none;
            padding: 12px 22px;
            border-radius: 25px;
            background: #ff75a8;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            transform: scale(1.08);
            background: #ff4f91;
        }

        button:active {
            transform: scale(0.95);
        }

        /* Floating hearts */
        .heart {
            position: absolute;
            font-size: 25px;
            animation: heartFloat 5s linear infinite;
            opacity: 0.7;
        }

        @keyframes heartFloat {
            from {
                transform: translateY(100vh) rotate(0deg);
            }

            to {
                transform: translateY(-100px) rotate(360deg);
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <!-- Page 1 -->
        <div class="page active">
            <h1>💗 Hello!</h1>

            <img class="cute-img" src="N1.jpeg" alt="Cute">

            <p>
                so beautiful 🌷 ✨
            </p>

            <span class="click-text" onclick="showMessage()">
                💕 ចុចលើខ្ញុំ
            </span>
        </div>

        <!-- Page 2 -->
        <div class="page">
            <h1>🌸 Page 2</h1>

            <img class="cute-img" src="N2.jpeg" alt="Cute flower">

            <p>
                Welcome to my heart 💖
            </p>

            <span class="click-text" onclick="showMessage()">
                ✨ ចុចទីនេះ
            </span>
        </div>

        <!-- Page 3 -->
        <div class="page">
            <h1>🧸 Page 3</h1>

            <img class="cute-img" src="N3.jpeg" alt="Cute bear">

            <p>
                be with me 💕
            </p>

            <span class="click-text" onclick="showMessage()">
                💖 ចុចមើល
            </span>
        </div>

        <!-- page 4 -->
        <div class="page">
            <h1>🎬 Page 4</h1>

            <video width="250" height="270" controls autoplay loop muted>
                <source src="N4.mp4" type="video/mp4">
            </video>
            <p>
                I love you 💗
            </p>
        </div>
        <!-- Buttons -->
        <div class="buttons">
            <button onclick="prevPage()">⬅️ ត្រឡប់</button>
            <button onclick="nextPage()">បន្ទាប់ ➡️</button>
        </div>

    </div>

    <script>

        let currentPage = 0;

        const pages = document.querySelectorAll(".page");

        function showPage(index) {

            pages.forEach(page => {
                page.classList.remove("active");
            });

            pages[index].classList.add("active");
        }

        function nextPage() {

            currentPage++;

            if (currentPage >= pages.length) {
                currentPage = 0;
            }

            showPage(currentPage);
        }

        function prevPage() {

            currentPage--;

            if (currentPage < 0) {
                currentPage = pages.length - 1;
            }

            showPage(currentPage);
        }

        function showMessage() {

            alert("💗 អរគុណដែលចុចមកទីនេះ! ✨");
        }

        /* Floating hearts */

        function createHeart() {

            const heart = document.createElement("div");

            heart.className = "heart";
            heart.innerHTML = "💗";

            heart.style.left = Math.random() * 100 + "vw";
            heart.style.animationDuration =
                (3 + Math.random() * 4) + "s";

            document.body.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 7000);
        }

        setInterval(createHeart, 700);

    </script>

</body>

</html>
